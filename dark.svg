<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <filter id="glass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" />
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1180" height="610" fill="url(#bgGrad)" />
  <circle cx="200" cy="100" r="150" fill="#4c1d95" filter="url(#glass)" opacity="0.3">
    <animate attributeName="cx" values="200;250;200" dur="20s" repeatCount="indefinite" />
  </circle>

  <!-- Left Side (ASCII Area) -->
  <g id="ascii-portrait" transform="translate(40, 40)">
    <rect width="400" height="530" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    <text x="200" y="265" font-family="monospace" font-size="12" fill="url(#textGrad)" text-anchor="middle">
      [ ASCII PORTRAIT PLACEHOLDER ]
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Right Side (Terminal) -->
  <g id="terminal" transform="translate(480, 40)">
    <rect width="660" height="530" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    <text x="30" y="60" font-family="sans-serif" font-size="32" font-weight="bold" fill="#F8FAFC">
      Hi 👋, I'm Andres Felipe
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" />
    </text>
    <text x="30" y="110" font-family="monospace" font-size="24" fill="#22D3EE">
      Full Stack Developer_
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </text>
  </g>
</svg>

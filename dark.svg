<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="1180" height="610" fill="#030712" rx="20" ry="20" />
  
  <!-- Layout Wrapper -->
  <g transform="translate(20, 20)">
    <!-- Left Side: ASCII Portrait Placeholder -->
    <rect width="420" height="570" fill="#0F172A" rx="15" ry="15" stroke="rgba(255,255,255,.08)" stroke-width="1" />
    <text x="210" y="285" fill="url(#grad)" font-family="monospace" font-size="20" text-anchor="middle">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
      [ C R A O S ]
    </text>
    
    <!-- Right Side: Terminal -->
    <g transform="translate(450, 0)">
      <rect width="710" height="570" fill="#0F172A" rx="15" ry="15" stroke="rgba(255,255,255,.08)" stroke-width="1" />
      <text x="30" y="50" fill="#F8FAFC" font-family="sans-serif" font-size="24" font-weight="bold">
        Hi 👋 I'm Andres Felipe Martinez Henao
      </text>
      <!-- Typing Animation Placeholder -->
      <text x="30" y="100" fill="#94A3B8" font-family="monospace" font-size="20">
        > Full Stack Developer_
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </text>
    </g>
  </g>
</svg>